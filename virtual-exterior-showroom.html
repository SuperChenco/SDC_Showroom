<title>曜之岩 SDC · 外墙材料虚拟展厅</title>
<style>
  :root{--ink:#202a31;--muted:#74808a;--line:#dce2e5;--paper:#fbfcfc;--accent:#b56d48}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#dfe6eb}
  #stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
  .topbar{position:fixed;z-index:2;top:24px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  .brand{display:flex;align-items:center;gap:12px}.brand-logo{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 1px 2px #26313b24)}.brand-name{font-size:13px;font-weight:700;letter-spacing:1.1px;color:#182127}.brand-sub{font-size:9px;letter-spacing:1.05px;color:#64717a;margin-top:4px}
  .view-label{border:1px solid #ffffffad;background:#f8faf9c9;padding:10px 14px;font-size:10px;letter-spacing:1.3px;color:#4d5b64;backdrop-filter:blur(12px)}
  .panel{position:fixed;z-index:3;right:26px;top:84px;bottom:24px;width:328px;background:#fbfcfcf2;border:1px solid #ffffffd9;box-shadow:0 14px 50px #24313b20;display:flex;flex-direction:column;backdrop-filter:blur(20px)}
  .panel-head{padding:25px 24px 17px;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:2px;color:#9a6b52;font-weight:700}.panel h1{font:500 23px Georgia,"Noto Serif SC",serif;margin:9px 0 5px;letter-spacing:.2px}.panel-head p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}
  .tabs{display:grid;grid-template-columns:1fr 1fr;padding:16px 20px 0;gap:4px}.tab{border:0;background:transparent;padding:11px 6px;color:#849098;font-size:11px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-color:var(--accent);font-weight:650}
  .section-label{padding:14px 20px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:1px;color:#58636b}.catalog-tools{display:flex;align-items:center;gap:7px}.family-filter{max-width:112px;border:1px solid #dfe4e6;background:#fff;color:#637078;padding:5px 7px;font-size:9px;letter-spacing:0;outline:none}.count{white-space:nowrap;color:#a3abb0;font-size:9px}
  .products{padding:0 19px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px;overflow:auto}.product{appearance:none;border:1px solid #e0e5e7;padding:0;background:#fff;text-align:left;cursor:pointer;transition:.18s;position:relative;color:inherit}.product:hover{border-color:#a7b0b5;transform:translateY(-1px)}.product.selected{border:1.5px solid #ad6745;box-shadow:0 0 0 2px #ad67451a}.swatch{height:74px;position:relative;overflow:hidden;background:#e7e4dc}.swatch img{width:100%;height:100%;display:block;object-fit:cover}.swatch:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff15,transparent 60%,#00000012);pointer-events:none}.product-name{font-size:10px;font-weight:600;padding:9px 9px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-meta{font-size:9px;color:#929ba0;padding:0 9px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{position:absolute;right:7px;top:7px;width:17px;height:17px;background:#fff;color:#a85f3d;border-radius:50%;display:grid;place-items:center;font-size:10px;opacity:0}.selected .check{opacity:1}
  .panel-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 22px 18px}.finish-label{font-size:9px;letter-spacing:1.4px;color:#7b858b;margin-bottom:10px}.finish-row{display:flex;gap:7px}.finish{flex:1;border:1px solid #dfe4e6;background:#fff;padding:9px 7px;font-size:9px;color:#69747b;cursor:pointer}.finish.active{border-color:#7e8d94;color:#29343b;background:#f1f4f4}.hint{font-size:9px;line-height:1.6;color:#8b969b;margin-top:12px}.reset{position:fixed;z-index:2;left:28px;bottom:26px;background:#f7f9f9dc;border:1px solid #ffffffb0;padding:11px 14px;font-size:10px;letter-spacing:.5px;color:#55636b;cursor:pointer;backdrop-filter:blur(10px)}.reset:hover{background:white}.tip{position:fixed;z-index:1;left:28px;top:88px;color:#f7fafb;text-shadow:0 1px 6px #23374688;font-size:10px;letter-spacing:.7px}.toast{position:fixed;z-index:5;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;background:#1f2b31eF;color:#fff;padding:10px 15px;font-size:10px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:700px){.topbar{top:13px;left:14px;right:14px}.view-label{display:none}.panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(49vh,405px);border-width:1px 0 0}.panel-head{padding:13px 18px 8px}.panel h1{font-size:18px;margin:5px 0 3px}.panel-head p{font-size:10px}.tabs{padding:5px 14px 0}.section-label{padding:9px 18px 7px}.products{grid-template-columns:repeat(4,minmax(110px,1fr));padding:0 14px 8px;gap:7px}.swatch{height:43px}.product-name{font-size:9px;padding:6px 6px 1px}.product-meta{padding:0 6px 6px;font-size:8px}.panel-foot{padding:8px 15px 10px}.hint{display:none}.finish-label{margin-bottom:6px}.finish{padding:7px 4px}.tip{top:63px;left:14px;font-size:9px}.reset{left:14px;bottom:calc(min(49vh,405px) + 12px);padding:8px 10px}}
</style>

const materialCache=new Map();
const textureLoader=new THREE.TextureLoader();
let materialSet;
function makeMaterial(product){
  if(materialCache.has(product.id))return materialCache.get(product.id);
  const texture=textureLoader.load(product.url,undefined,undefined,error=>console.error('花色图片加载失败:',product.url,error));
  texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;
  // Detail scale 2 halves the visual size of each source pattern while keeping
  // the physical board joints unchanged. Each 3030 mm board now shows six
  // source repeats; vertical material detail is doubled as well.
  const MATERIAL_DETAIL_SCALE=2;
  texture.repeat.set(MATERIAL_DETAIL_SCALE/SOURCE_TILE_LENGTH_M,MATERIAL_DETAIL_SCALE/BOARD_COURSE_M);texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const material=new THREE.MeshStandardMaterial({color:'#ffffff',map:texture,roughness:.8,metalness:.015});
  material.userData.productId=product.id;materialCache.set(product.id,material);return material;
}
function releaseInactiveMaterials(){
  const active=new Set(Object.values(materialSet));
  for(const [id,material] of materialCache){if(!active.has(material)){material.userData.released=true;material.map?.dispose();material.dispose();materialCache.delete(id)}}
}

const trim=makeBoxMaterial('#c2c5c4',.42,.38), dark=makeBoxMaterial('#303b40',.55,.15), glass=new THREE.MeshPhysicalMaterial({color:'#7f9ca5',roughness:.14,metalness:.22,transparent:true,opacity:.78,side:THREE.DoubleSide});

// Create a facade patch with meter-based UV coordinates. Textures are sampled
// in consistent physical scale even though the facade is split into many meshes.
function facadePatch(parent,x0,x1,y0,y1,z,material,groupName){
  if(x1-x0<.015||y1-y0<.015)return;
  const geo=new THREE.PlaneGeometry(x1-x0,y1-y0,1,1);
  const pos=geo.attributes.position, uv=geo.attributes.uv;
  // PlaneGeometry local coordinates are centered; turn them into global meter UVs.
  for(let i=0;i<pos.count;i++){uv.setXY(i,pos.getX(i)+((x0+x1)/2),pos.getY(i)+((y0+y1)/2));}
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,material);mesh.position.set((x0+x1)/2,(y0+y1)/2,z);mesh.name=groupName||'CladdingPanel';mesh.castShadow=false;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function addFrontWallZone(parent,x0,x1,openings,material,z){
  const xs=[x0,x1];for(const o of openings){if(o.x1>x0&&o.x0<x1){xs.push(Math.max(x0,o.x0),Math.min(x1,o.x1));}}
  xs.sort((a,b)=>a-b);const uniq=xs.filter((v,i)=>i===0||v-xs[i-1]>.001);
  for(let i=0;i<uniq.length-1;i++){
    const a=uniq[i],b=uniq[i+1],mid=(a+b)/2;
    const cuts=openings.filter(o=>mid>o.x0-.001&&mid<o.x1+.001).map(o=>[o.y0,o.y1]).sort((p,q)=>p[0]-q[0]);
    let y=0;for(const [lo,hi] of cuts){if(lo>y)facadePatch(parent,a,b,y,lo,z,material);y=Math.max(y,hi);}if(y<HOUSE.height)facadePatch(parent,a,b,y,HOUSE.height,z,material);
  }
}
function box(parent,name,size,pos,material,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),material);m.name=name;m.position.set(...pos);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
function cylinderBetween(parent,a,b,r,material,name){const p1=new THREE.Vector3(...a),p2=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(p2,p1);const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.78,r,d.length(),8),material);m.position.copy(p1).add(p2).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.name=name;m.castShadow=true;parent.add(m);return m}

// ── Architectural blockout inspired by the supplied S06 house photos ───────
materialSet={main:makeMaterial(products[0]),accent:makeMaterial(products[0])};
const openings=[
  {type:'door',x0:-3.25,x1:-2.25,y0:.08,y1:2.25},
  {type:'window',x0:-1.55,x1:-.25,y0:.82,y1:2.02},
  {type:'window',x0:1.02,x1:2.42,y0:.82,y1:2.02},
  {type:'window',x0:1.05,x1:2.42,y0:4.15,y1:5.52}
];
const frontZ=HOUSE.depth/2+.015, split=HOUSE.splitX;
addFrontWallZone(mainWall,-HOUSE.width/2,split,openings.filter(o=>o.x0<split),materialSet.main,frontZ);
addFrontWallZone(accentWall,split,HOUSE.width/2,openings.filter(o=>o.x1>split),materialSet.accent,frontZ+.012);
// Recessed board joints: 455 mm courses and 3030 mm board lengths. Each groove
// is split around doors/windows so the panel grid reads as installed cladding.
const panelReveal=new THREE.MeshStandardMaterial({color:'#797b75',roughness:.92,transparent:true,opacity:.42,depthWrite:false});
function addCladdingJoints(parent,x0,x1,zoneOpenings,z){
  const grooveZ=z+.009, jointDepth=.008, jointHeight=.009;
  for(let y=.455;y<HOUSE.height-.08;y+=.455){
    const cuts=[x0,...zoneOpenings.filter(o=>y>o.y0-.01&&y<o.y1+.01).flatMap(o=>[Math.max(x0,o.x0),Math.min(x1,o.x1)]),x1].sort((a,b)=>a-b);
    for(let i=0;i<cuts.length-1;i+=2){if(cuts[i+1]-cuts[i]<.02)continue;const joint=box(parent,'HorizontalPanelJoint',[cuts[i+1]-cuts[i],jointHeight,jointDepth],[(cuts[i]+cuts[i+1])/2,y,grooveZ],panelReveal,false);joint.userData.preserveMaterial=true}
  }
  for(let x=-HOUSE.width/2+BOARD_LENGTH_M;x<x1-.04;x+=BOARD_LENGTH_M){if(x<=x0+.04)continue;
    const cuts=[0,...zoneOpenings.filter(o=>x>o.x0-.01&&x<o.x1+.01).flatMap(o=>[o.y0,o.y1]),HOUSE.height].sort((a,b)=>a-b);
    for(let i=0;i<cuts.length-1;i+=2){if(cuts[i+1]-cuts[i]<.02)continue;const joint=box(parent,'VerticalPanelJoint',[.008,cuts[i+1]-cuts[i],jointDepth],[x,(cuts[i]+cuts[i+1])/2,grooveZ],panelReveal,false);joint.userData.preserveMaterial=true}
  }
}
addCladdingJoints(mainWall,-HOUSE.width/2,split,openings.filter(o=>o.x0<split),frontZ);
addCladdingJoints(accentWall,split,HOUSE.width/2,openings.filter(o=>o.x1>split),frontZ+.012);
// Side and rear faces of the main wall shell, plus the shallow accent return.
function sidePlane(parent,axis,coord,a0,a1,y0,y1,material,name){
  const geo=new THREE.PlaneGeometry(a1-a0,y1-y0);const pos=geo.attributes.position,uv=geo.attributes.uv;
  const center=(a0+a1)/2;for(let i=0;i<pos.count;i++){uv.setXY(i,pos.getX(i)+center,pos.getY(i)+(y0+y1)/2)}
  const mesh=new THREE.Mesh(geo,material);mesh.name=name;
  if(axis==='x'){mesh.rotation.y=coord>0?Math.PI/2:-Math.PI/2;mesh.position.set(coord,(y0+y1)/2,center)}
  else{mesh.rotation.y=coord<0?Math.PI:0;mesh.position.set(center,(y0+y1)/2,coord)}
  mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
sidePlane(mainWall,'x',-HOUSE.width/2,-HOUSE.depth/2,HOUSE.depth/2,0,HOUSE.height,materialSet.main,'MainWall_LeftElevation');
sidePlane(mainWall,'z',-HOUSE.depth/2,-HOUSE.width/2,HOUSE.width/2,0,HOUSE.height,materialSet.main,'MainWall_RearElevation');
sidePlane(accentWall,'x',HOUSE.width/2,-HOUSE.depth/2,HOUSE.depth/2,0,HOUSE.height,materialSet.accent,'AccentWall_RightElevation');
// Roof fascia / parapet cap, base plinth and corner trims.
box(detailRoot,'FlatRoof',[HOUSE.width+.18,.16,HOUSE.depth+.18],[0,HOUSE.height+.04,0],makeBoxMaterial('#d9dad5',.72,.08));
box(detailRoot,'FoundationCourse',[HOUSE.width+.12,.23,HOUSE.depth+.12],[0,.115,0],makeBoxMaterial('#777a77',.8));
box(detailRoot,'AccentVerticalReveal',[.045,HOUSE.height,.035],[split, HOUSE.height/2,frontZ+.018],trim,false);
// A restrained front fascia and metal sill line.
const roofMetal=makeBoxMaterial('#43484a',.38,.5);
box(detailRoot,'FrontRoofEdge',[HOUSE.width+.12,.055,.075],[0,HOUSE.height-.035,frontZ+.085],roofMetal,false);
box(detailRoot,'RightRoofEdge',[.075,.055,HOUSE.depth+.12],[HOUSE.width/2+.055,HOUSE.height-.035,0],roofMetal,false);
box(detailRoot,'FacadeCorner_L',[.065,HOUSE.height,.065],[-HOUSE.width/2+.035,HOUSE.height/2,frontZ+.035],trim,false);
box(detailRoot,'FacadeCorner_R',[.065,HOUSE.height,.065],[HOUSE.width/2-.035,HOUSE.height/2,frontZ+.035],trim,false);

// Windows: dark recessed reveal, glass, silver frames, mullions and projecting sill.
function addWindow(o,index){
  const g=new THREE.Group();g.name=`Window_${index}`;detailRoot.add(g);const w=o.x1-o.x0,h=o.y1-o.y0,cx=(o.x0+o.x1)/2,cy=(o.y0+o.y1)/2,z=frontZ+.045;
  box(g,'WindowRecess',[w+.08,h+.08,.08],[cx,cy,z-.09],dark,false);
  const pane=new THREE.Mesh(new THREE.PlaneGeometry(w-.08,h-.08),glass);pane.name='Glazing';pane.position.set(cx,cy,z-.035);g.add(pane);
  const frame=.055;
  box(g,'Frame_Left',[frame,h+.1,.075],[o.x0-frame/2,cy,z],trim,false);box(g,'Frame_Right',[frame,h+.1,.075],[o.x1+frame/2,cy,z],trim,false);
  box(g,'Frame_Top',[w+.1,frame,.075],[cx,o.y1+frame/2,z],trim,false);box(g,'Frame_Sill',[w+.12,frame,.09],[cx,o.y0-frame/2,z+.015],trim,false);
  box(g,'Mullion_Vertical',[.035,h-.04,.045],[cx,cy,z+.016],trim,false);box(g,'Mullion_Horizontal',[w-.035,.035,.045],[cx,cy,z+.02],trim,false);
  box(g,'ExteriorSill',[w+.2,.055,.28],[cx,o.y0-.04,z+.12],makeBoxMaterial('#aeb2b0',.36,.24),false);
}
openings.filter(o=>o.type==='window').forEach((o,i)=>addWindow(o,i+1));
// Entry door and slim canopy/handle.
const door= new THREE.Group();door.name='EntryDoor';detailRoot.add(door);
const doorMat=makeBoxMaterial('#737779',.38,.15);
box(door,'Leaf',[.91,2.12,.09],[-2.75,1.15,frontZ+.06],doorMat,false);
box(door,'DoorJamb_L',[.065,2.22,.1],[-3.25,1.18,frontZ+.12],trim,false);box(door,'DoorJamb_R',[.065,2.22,.1],[-2.25,1.18,frontZ+.12],trim,false);
box(door,'DoorHead',[1.06,.065,.1],[-2.75,2.29,frontZ+.12],trim,false);
box(door,'Handle',[.035,.48,.055],[-2.42,1.2,frontZ+.16],makeBoxMaterial('#b5b8b6',.25,.7),false);
box(door,'EntryCanopy',[1.25,.09,.55],[-2.75,2.37,frontZ+.29],makeBoxMaterial('#c3b59f',.5,.2));
// Ground-floor entry steps, small HVAC placeholder and freestanding mailbox plinth.
box(detailRoot,'Step_1',[1.75,.18,.5],[-2.75,.09,frontZ+.42],makeBoxMaterial('#c7c3b8'));
box(detailRoot,'Step_2',[1.48,.17,.4],[-2.75,.265,frontZ+.23],makeBoxMaterial('#d4d0c5'));
const hvac=box(detailRoot,'OutdoorHVAC',[.92,.72,.38],[.75,.42,frontZ+.32],makeBoxMaterial('#e0ded5',.7));
for(let i=0;i<9;i++)box(detailRoot,'HVACVent',[.012,.48,.012],[.39+i*.09,.42,frontZ+.52],dark,false);

// A few quiet site elements make the product readable without competing with it.
const groundMat=makeBoxMaterial('#aab1a5',.96);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.06;ground.receiveShadow=true;ground.name='Ground';scene.add(ground);
const paving=makeBoxMaterial('#d2cfc5',.86);
box(scene,'EntryWalk',[2.05,.07,4.8],[-2.75,-.015,5.0],paving,false);
for(let i=0;i<3;i++)box(scene,'PathJoint',[.018,.006,4.8],[-3.42+i*.67,.022,5],makeBoxMaterial('#b8b5ac'),false);
// Low, simplified planting clumps at the edge of the composition.
const leafMat=new THREE.MeshStandardMaterial({color:'#71866b',roughness:.92});
for(const [x,z] of [[-5.1,1.2],[4.9,-1.0],[4.7,3.8]]){
  const trunk=box(detailRoot,'LandscapeStem',[.055,1.35,.055],[x,.67,z],makeBoxMaterial('#73624e'),false);
  for(let j=0;j<9;j++){const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(.22+Math.random()*.15,1),leafMat);leaf.position.set(x+(Math.random()-.5)*.8,1.1+Math.random()*1.3,z+(Math.random()-.5)*.55);leaf.scale.set(1,.75,.85);leaf.castShadow=true;leaf.name='LandscapeFoliage';scene.add(leaf)}
}

// ── GLB/GLTF replacement hook ──────────────────────────────────────────────
// To replace the placeholder, set MODEL_URL to a .glb/.gltf URL and uncomment
// the loader call below. Name the exported wall meshes `MainWall` and
// `AccentWall` (or map their material/mesh names in bindImportedWallZones).
// If your GLB uses multiple meshes per zone, collect them by name prefix or
// custom gltf node extras, then assign the chosen MeshStandardMaterial to each.
const MODEL_URL = ''; // e.g. './models/house.glb'
function bindImportedWallZones(gltf){
  const imported=gltf.scene; const importedZones={main:[],accent:[]};
  imported.traverse(node=>{
    if(!node.isMesh)return;
    if(node.name==='MainWall'||node.name.startsWith('MainWall_')) importedZones.main.push(node);
    if(node.name==='AccentWall'||node.name.startsWith('AccentWall_')) importedZones.accent.push(node);
  });
  if(!importedZones.main.length||!importedZones.accent.length){console.warn('GLB needs meshes named MainWall* and AccentWall*.');return;}
  // Fit the imported asset to the placeholder's ~8 × 6 × 5.2 m envelope,
  // center it on the showroom origin and place its feet on the ground plane.
  // For an already correctly scaled, centered GLB, set fitScale=1 instead.
  imported.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(imported), size=bounds.getSize(new THREE.Vector3());
  const fitScale=Math.min(HOUSE.width/size.x,HOUSE.height/size.y,HOUSE.depth/size.z);
  imported.scale.setScalar(fitScale); imported.updateMatrixWorld(true);
  const fitted=new THREE.Box3().setFromObject(imported), center=fitted.getCenter(new THREE.Vector3());
  imported.position.x-=center.x; imported.position.z-=center.z; imported.position.y-=fitted.min.y;
  importedZones.main.forEach(mesh=>{mesh.material=materialSet.main;mesh.castShadow=true;mesh.receiveShadow=true});
  importedZones.accent.forEach(mesh=>{mesh.material=materialSet.accent;mesh.castShadow=true;mesh.receiveShadow=true});
  modelRoot.visible=false; imported.name='ImportedHouse'; scene.add(imported); window.importedWallZones=importedZones;
}
if(MODEL_URL){new GLTFLoader().load(MODEL_URL,bindImportedWallZones,undefined,e=>console.error('GLB load failed:',e));}

// ── Product selector ──────────────────────────────────────────────────────
const activeProduct={main:products[0],accent:products[0]};let activeZone='main';
const list=document.querySelector('#products');const zoneTitle=document.querySelector('#zoneTitle');
const familyFilter=document.querySelector('#familyFilter');const productCount=document.querySelector('#productCount');
for(const family of [...new Set(products.map(p=>p.family))].sort((a,b)=>a.localeCompare(b,'zh-CN'))){const option=document.createElement('option');option.value=family;option.textContent=family;familyFilter.appendChild(option)}
familyFilter.addEventListener('change',renderProducts);
function renderProducts(){
  const visible=products.filter(p=>familyFilter.value==='all'||p.family===familyFilter.value);productCount.textContent=`${visible.length}/${products.length}`;list.innerHTML='';
  for(const p of visible){const btn=document.createElement('button');btn.className='product'+(activeProduct[activeZone].id===p.id?' selected':'');btn.title=`${p.family} · ${p.code}`;btn.innerHTML=`<div class="swatch"><img loading="lazy" src="${p.thumb}" alt="${p.family} ${p.code}"></div><span class="check">✓</span><div class="product-name">${p.family}</div><div class="product-meta">${p.code}</div>`;btn.addEventListener('click',()=>selectProduct(p));list.appendChild(btn)}
}
function selectProduct(p){activeProduct[activeZone]=p;const material=makeMaterial(p);materialSet[activeZone]=material;
  const group=activeZone==='main'?mainWall:accentWall;group.traverse(o=>{if(o.isMesh&&!o.userData.preserveMaterial)o.material=material});
  const imported=window.importedWallZones?.[activeZone];if(imported) imported.forEach(mesh=>mesh.material=material);
  releaseInactiveMaterials();renderProducts();toast(`${activeZone==='main'?'主墙':'副墙'}已应用：${p.family} · ${p.code}`);
}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));activeZone=tab.dataset.zone;zoneTitle.textContent=activeZone==='main'?'主墙 · MAIN WALL':'副墙 · ACCENT WALL';renderProducts()}));
document.querySelectorAll('.finish').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.finish').forEach(b=>b.classList.toggle('active',b===btn));const mode=btn.dataset.light;if(mode==='day'){scene.background.set('#dce5eb');sun.color.set('#fff3df');sun.intensity=3.2;fill.intensity=1.25;renderer.toneMappingExposure=1.05}else if(mode==='warm'){scene.background.set('#e8d4bc');sun.color.set('#ffd5a2');sun.intensity=3.8;fill.intensity=.72;renderer.toneMappingExposure=1.08}else{scene.background.set('#d5dadd');sun.color.set('#ffffff');sun.intensity=2.4;fill.intensity=1.65;renderer.toneMappingExposure=.98}}));
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1700)}
if(location.protocol==='file:')setTimeout(()=>toast('检测到 file:// 打开方式：请用本地 HTTP 服务打开，避免贴图被浏览器拦截。'),900);
renderProducts();
document.querySelector('#resetView').addEventListener('click',()=>{camera.position.set(12.75,8.6,16.0);controls.target.set(0,2.65,0);controls.update()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
